name: Gallery caption sync

# Publishes admin caption/album edits into the committed gallery manifest.
# The public site reads only src/data/galleryManifest.json, so edits made in
# Admin → Galleries stay invisible until this job (or a local
# `npm run gallery:sync`) commits them. Runs daily and on demand; opens a PR
# when the manifest drifts, and stays silent when everything matches.
#
# Needs the NEXT_PUBLIC_CONVEX_URL repo secret so the sync can read the
# admin's curated captions from Convex (no secret values are involved —
# the query is public, IMPORT_SECRET is not required).

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Sync manifest from Convex
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
        run: |
          cp src/data/galleryManifest.json /tmp/manifest-before.json
          npm run gallery:sync

      - name: Verify manifest matches committed files
        run: npm run gallery:check

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet -- src/data/galleryManifest.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build caption change summary
        if: steps.changes.outputs.changed == 'true'
        id: diff
        run: |
          {
            echo 'body<<EOF_MARKDOWN'
            node scripts/gallery-manifest.mjs diff --base /tmp/manifest-before.json
            echo 'EOF_MARKDOWN'
          } >> "$GITHUB_OUTPUT"

      - name: Open publish PR
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            Publish gallery caption edits from the admin dashboard

            gallery:sync merged the latest captions, titles, and themes from
            Convex into the committed manifest. Merging deploys them to the
            public site.

            🤖 Generated with Codebuff
            Co-Authored-By: Codebuff <noreply@codebuff.com>
          title: "Publish gallery caption edits"
          body: |
            Admin caption/album edits from the gallery dashboard are not
            published yet. This PR merges them into
            `src/data/galleryManifest.json` — the public site's source of
            truth. Merging deploys the edits.

            ${{ steps.diff.outputs.body }}

            _Auto-generated by the gallery caption sync workflow._
          branch: gallery-caption-sync
          delete-branch: true
          labels: |
            content
            automated
