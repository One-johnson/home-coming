name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Dev tooling (vitest/convex-test) has strict peer ranges; the repo
      # installs with legacy-peer-deps locally, so CI mirrors that.
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Typecheck (app)
        run: npx tsc --noEmit

      - name: Typecheck (convex)
        run: npx tsc --noEmit -p convex/tsconfig.json

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
